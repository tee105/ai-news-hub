name: Daily News Sync

on:
  schedule:
    # 每天 08:00 UTC（北京时间 16:00）执行一次
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync news data
        run: pnpm run sync

      - name: Build site
        run: pnpm run build

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json .last-sync.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: daily news data update"
            git push
          fi